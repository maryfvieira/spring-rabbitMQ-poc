server:
  port: 8083
spring:
  application:
    name: CatalogService
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb;
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
schedule:
  enabled: true
  cron:
    job: 0 0/2 * * * ?
